name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
      - name: Install cargo-wix
        run: cargo install cargo-wix --version ^0.3
      - name: Build release binaries (x86_64)
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Build release binaries (arm64)
        run: cargo build --release --target aarch64-pc-windows-msvc
      - name: Verify GUI executable subsystems
        shell: pwsh
        run: ./.github/verify-gui-subsystems.ps1
      - name: Verify executable versions
        shell: pwsh
        run: ./.github/verify-executable-versions.ps1
      # GitHub-hosted Windows runners are x64; run tests natively.
      - run: cargo test --all --target x86_64-pc-windows-msvc
      - name: Package zip archives
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          for ARCH in x86_64 arm64; do
            if [ "$ARCH" = "x86_64" ]; then
              TARGET="x86_64-pc-windows-msvc"
            else
              TARGET="aarch64-pc-windows-msvc"
            fi
            DIR="LeopardWM-${VERSION}-${ARCH}-windows"
            mkdir "$DIR"
            cp target/${TARGET}/release/leopardwm.exe "$DIR/"
            cp target/${TARGET}/release/leopardwm-cli.exe "$DIR/"
            cp target/${TARGET}/release/lwm.exe "$DIR/"
            cp target/${TARGET}/release/leopardwm-watchdog.exe "$DIR/"
            cp README.md LICENSE "$DIR/"
            7z a "${DIR}.zip" "$DIR"
          done
      - name: Build MSI installers
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p target/wix
          # WiX 3.14 is pre-installed at this path on windows-latest runners.
          cargo wix -p leopardwm-daemon -I wix/main.wxs \
            --target x86_64-pc-windows-msvc \
            --output target/wix/LeopardWM-${VERSION}-x86_64.msi \
            --no-build --nocapture \
            --bin-path "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          cargo wix -p leopardwm-daemon -I wix/main.wxs \
            --target aarch64-pc-windows-msvc \
            --output target/wix/LeopardWM-${VERSION}-arm64.msi \
            --no-build --nocapture \
            --bin-path "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          cp target/wix/*.msi .
          ls *.msi
      - name: Extract changelog
        id: changelog
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # Extract the section for this version from CHANGELOG.md
          NOTES=$(awk "/^## \\[?${VERSION//./\\.}\\]?/{found=1; next} /^## /{if(found) exit} found{print}" CHANGELOG.md 2>/dev/null || true)
          if [ -z "$NOTES" ]; then
            echo "body=" >> $GITHUB_OUTPUT
          else
            # Use a delimiter for multiline output
            EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            echo "body<<$EOF" >> $GITHUB_OUTPUT
            echo "$NOTES" >> $GITHUB_OUTPUT
            echo "$EOF" >> $GITHUB_OUTPUT
          fi
      - name: Generate SHA256 checksums
        shell: bash
        run: |
          sha256sum LeopardWM-*.zip *.msi > checksums.txt
          cat checksums.txt
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        id: gh_release
        with:
          files: |
            LeopardWM-*.zip
            *.msi
            checksums.txt
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: ${{ steps.changelog.outputs.body == '' }}

  publish-winget:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    # WINGET_TOKEN is a classic PAT with public_repo and workflow scopes.
    # The new fork ref may include upstream workflow changes absent from the fork.
    if: ${{ !github.event.repository.fork }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download verified komac
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/russellbanks/Komac/releases/download/v2.17.1/komac-2.17.1-x86_64-pc-windows-msvc.exe'
          $exe = Join-Path $env:RUNNER_TEMP 'komac.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne 'a97c002c5ffa15f232af117efac6774e755d27acc47eba00f1661033267d7438') {
            throw 'komac SHA256 mismatch'
          }
      # Python and gh are provided by the GitHub-hosted runner image.
      - name: Generate Winget manifests
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $base = "https://github.com/jcardama/LeopardWM/releases/download/$env:GITHUB_REF_NAME"
          $exe = Join-Path $env:RUNNER_TEMP 'komac.exe'
          & $exe update jcardama.LeopardWM --version $version --urls "$base/LeopardWM-$version-x86_64.msi" "$base/LeopardWM-$version-arm64.msi" --dry-run > (Join-Path $env:RUNNER_TEMP 'komac-stdout.txt')
          python tools/winget_manifest.py (Join-Path $env:RUNNER_TEMP 'komac-stdout.txt') (Join-Path $env:RUNNER_TEMP 'winget-manifests')
      - name: Submit Winget pull request
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $title = "New version: jcardama.LeopardWM version $version"
          $query = "repo:microsoft/winget-pkgs is:pr is:open in:title `"$title`""
          $titles = @(gh api --paginate --method GET search/issues -f q="$query" -f per_page=100 --jq '.items[].title')
          if ($titles -ccontains $title) { throw "An open pull request already has title: $title" }
          $upstream = gh api repos/microsoft/winget-pkgs | ConvertFrom-Json
          $head = gh api "repos/microsoft/winget-pkgs/commits/$($upstream.default_branch)" | ConvertFrom-Json
          $fork = gh api repos/jcardama/winget-pkgs | ConvertFrom-Json
          $branch = "jcardama.LeopardWM-$version-$([guid]::NewGuid().ToString('N').ToUpperInvariant())"
          $graphqlFile = Join-Path $env:RUNNER_TEMP 'graphql-input.json'
          $ref = @{
            query = 'mutation($input: CreateRefInput!) { createRef(input: $input) { ref { name } } }'
            variables = @{ input = @{ repositoryId = $fork.node_id; name = "refs/heads/$branch"; oid = $head.sha } }
          }
          $ref | ConvertTo-Json -Depth 20 | Set-Content -Path $graphqlFile -Encoding utf8
          gh api graphql --input $graphqlFile
          $directory = Join-Path $env:RUNNER_TEMP 'winget-manifests'
          $additions = @(Get-ChildItem -Path $directory -File | ForEach-Object {
            @{ path = "manifests/j/jcardama/LeopardWM/$version/$($_.Name)"; contents = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName)) }
          })
          $commit = @{
            query = 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }'
            variables = @{ input = @{ branch = @{ repositoryNameWithOwner = 'jcardama/winget-pkgs'; branchName = $branch }; expectedHeadOid = $head.sha; message = @{ headline = $title }; fileChanges = @{ additions = $additions } } }
          }
          $commit | ConvertTo-Json -Depth 20 | Set-Content -Path $graphqlFile -Encoding utf8
          gh api graphql --input $graphqlFile
          $body = "Created by the [LeopardWM release workflow]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID)."
          gh pr create --repo microsoft/winget-pkgs --base $upstream.default_branch --head "jcardama:$branch" --title $title --body $body
        # No continue-on-error: failure must surface after the release is published.
